[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mining-three-source-pipeline"
version = "0.1.0"
description = "24h take-home: mining news + critical-minerals policy + commodity price aggregation with a natural-language /query API and a reproducible evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LingTian Mining Tech interview submission" }]
keywords = ["rag", "vector-search", "mining", "critical-minerals", "fastapi", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
chroma = ["chromadb>=0.5,<2"]
dev = [
  "pytest>=8.2,<10",
  "respx>=0.21,<1",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
mining-ingest = "pipeline.ingest:main"
mining-serve = "serve.app:main"
mining-eval = "eval.harness:main"

[project.urls]
Homepage = "https://github.com/<your-account>/mining-three-source-pipeline"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "serve", "eval"]
# NOTE: no ``force-include`` table. Mapping a package directory already ships
# everything underneath it, and a force-include entry duplicates those paths --
# hatchling then aborts with "A second file is being added to the wheel archive
# at the same path", which is exactly the bug that took a debugging cycle to find.

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "network: tests that require real network access (deselected by default in CI)",
  "slow: tests that take more than a second",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["pipeline", "serve", "eval", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "PL", "RUF"]
ignore = [
  "PLR0913",  # too many arguments (collector and store constructors)
  "PLR2004",  # magic value in comparison (domain thresholds)
  "PLR0911",  # too many returns in the payload dispatchers
  "PLR0912",  # too many branches in the query planner
  "PLR0915",  # too many statements in the CLI report
  "ARG002",   # unused method argument (Protocol signatures)
  # Optional backends are imported inside the factory so the default install
  # carries no chromadb dependency.
  "PLC0415",
  # ``class Settings(BaseSettings)`` etc. -- the naming convention for these
  # classes is fixed by the libraries, not by us.
  "N801",
  # Ambiguous-unicode warnings. The corpus, the ground truth and the prompts are
  # bilingual and full-width CJK punctuation (，。？（）) is correct typography, not
  # a homoglyph attack. Flagging it would push the codebase towards ASCII
  # punctuation inside Chinese strings, which is worse for a Chinese reader.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# E501 in tests: fixtures are corpus-shaped, so a long literal (a headline, a body
# of repeated text, a long `store.search(...)` call) is the point rather than a
# smell, and wrapping it obscures the data being asserted about.
"tests/*" = ["PLR2004", "S101", "E501"]
# ``eval`` is the directory name the brief asks for; the module-level name
# shadowing the builtin ``eval()`` is intentional and local to this package.
"eval/*" = ["A001"]
# A005: ``pipeline.http`` shares a name with the standard-library module. Inside a
# package the collision is nominal -- Python 3 imports are absolute, so every other
# module's ``import http`` still resolves to the stdlib -- and the import site reads
# better as ``from pipeline.http import HttpClient`` than with a ``_client`` suffix.
"pipeline/http.py" = ["A005"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "serve", "eval"]

[tool.mypy]
python_version = "3.11"
files = ["pipeline", "serve", "eval", "scripts"]
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["chromadb.*"]
ignore_missing_imports = true
